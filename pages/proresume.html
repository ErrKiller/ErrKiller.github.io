<style>

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--fb);font-size:var(--t3);line-height:1.5;color:var(--ct);background:var(--cbg);min-height:100vh;-webkit-font-smoothing:antialiased}
.app{display:flex;height:100vh;overflow:hidden}
.ep{width:420px;min-width:420px;height:100vh;overflow-y:auto;background:var(--cs);border-right:1px solid var(--cbd);display:flex;flex-direction:column}
.ehd{padding:var(--s4) var(--s5);border-bottom:1px solid var(--cbd);position:sticky;top:0;z-index:10;background:var(--cs)}
.ehd h1{font-size:var(--t6);font-weight:700;color:var(--cp);margin-bottom:var(--s1)}
.ehd p{font-size:var(--t2);color:var(--ctm)}
.ec{flex:1;padding:var(--s4) var(--s5) 120px}
.pp{flex:1;display:flex;flex-direction:column;background:var(--cbg);overflow:hidden}
.pt{display:flex;align-items:center;justify-content:space-between;padding:var(--s3) var(--s5);background:var(--cs);border-bottom:1px solid var(--cbd);gap:var(--s3);flex-wrap:wrap}
.pa{flex:1;overflow:auto;padding:var(--s5);display:flex;justify-content:center;align-items:flex-start}
.a4{width:var(--a4w);min-height:var(--a4h);background:#fff;box-shadow:var(--sh);position:relative;transform-origin:top center;transition:transform .4s cubic-bezier(.4,0,.2,1)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);padding:var(--s2) var(--s3);border-radius:var(--r2);font-family:var(--fb);font-size:var(--t2);font-weight:500;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.bp{background:var(--cp);color:#fff}.bp:hover{filter:brightness(1.15);transform:translateY(-1px);box-shadow:var(--sh)}
.bs{background:var(--csa);color:var(--ct);border:1px solid var(--cbd)}.bs:hover{background:var(--cbd)}
.bdg{background:var(--cda);color:#fff}
.bg{background:transparent;color:var(--ct2)}.bg:hover{background:var(--csa);color:var(--ct)}
.bsm{padding:var(--s1) var(--s2);font-size:var(--t1)}
.bi{width:32px;height:32px;padding:0;border-radius:var(--r2)}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none!important}
.ig{margin-bottom:var(--s3)}
.ig label{display:block;font-size:var(--t2);font-weight:500;color:var(--ct2);margin-bottom:var(--s1)}
.ig input,.ig textarea,.ig select{width:100%;padding:var(--s2) var(--s3);border:1px solid var(--cbd);border-radius:var(--r2);font-family:var(--fb);font-size:var(--t2);color:var(--ct);background:var(--cs);transition:border-color .15s,box-shadow .15s}

.sc{background:var(--cs);border:1px solid var(--cbd);border-radius:var(--r3);padding:var(--s4);margin-bottom:var(--s4)}
.st{font-size:var(--t4);font-weight:600;color:var(--cp);margin-bottom:var(--s3);padding-bottom:var(--s2);border-bottom:2px solid var(--cbd);display:flex;align-items:center;gap:var(--s2)}
.ic{background:var(--csa);border:1px solid var(--cbd);border-radius:var(--r2);padding:var(--s3);margin-bottom:var(--s3);position:relative}
.ich{display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--s2)}
.ict{font-weight:600;font-size:var(--t2);color:var(--ct)}
.ia{display:flex;gap:var(--s1)}
.row{display:flex;gap:var(--s3);margin-bottom:var(--s3)}.row .ig{flex:1;margin-bottom:0}
.tg{display:flex;align-items:center;gap:var(--s2)}
.tl{font-size:var(--t2);font-weight:500;color:var(--ct2);white-space:nowrap}
.sel{padding:var(--s1) var(--s3);border:1px solid var(--cbd);border-radius:var(--r2);font-size:var(--t2);background:var(--cs);color:var(--ct);cursor:pointer;min-width:140px}

.zc{display:flex;align-items:center;gap:var(--s2)}

.tabs{display:flex;gap:var(--s1);margin-bottom:var(--s4);border-bottom:1px solid var(--cbd);padding-bottom:var(--s2);flex-wrap:wrap}
.tab{padding:var(--s2) var(--s3);font-size:var(--t2);font-weight:500;color:var(--ctm);cursor:border:none;background:none;border-radius:var(--r2);transition:all .15s;position:relative;display:flex;align-items:center;gap:4px}
.tab:hover{color:var(--ct);background:var(--csa)}.tab.on{color:var(--cp);background:var(--csa)}
.tab.on::after{content:'';position:absolute;bottom:-9px;left:20%;right:20%;height:2px;background:var(--cp);border-radius:1px}
.tr{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--cbd)}
.tr:last-child{border-bottom:none}
.trl{font-size:var(--t2);font-weight:500;color:var(--ct);display:flex;align-items:center;gap:8px}
.trs{font-size:11px;color:var(--ctm);margin-top:2px}
.tog{position:relative;width:40px;height:22px;flex-shrink:0}
.tog input{opacity:0;width:0;height:0}
.tsl{position:absolute;cursor:pointer;inset:0;background:var(--cbd);border-radius:22px;transition:.2s}
.tsl::before{position:absolute;content:'';height:16px;width:16px;left:3px;bottom:3px;background:#fff;border-radius:50%;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tog input:checked + .tsl{background:var(--ca)}.tog input:checked + .tsl::before{transform:translateX(18px)}
.toast-c{position:fixed;bottom:var(--s5);right:var(--s5);z-index:300;display:flex;flex-direction:column;gap:var(--s2)}
.toast{padding:var(--s3) var(--s4);border-radius:var(--r3);font-size:var(--t2);font-weight:500;color:#fff;box-shadow:var(--sh);animation:tin .3s;display:flex;align-items:center;gap:var(--s2)}
.tok{background:var(--cok)}.toe{background:var(--cda)}.toi{background:var(--ca)}

.lo{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:200}
.ls{width:48px;height:48px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite}

/* Classic */
.tc{display:flex;min-height:var(--a4h)}.tc .sb{width:72mm;background:var(--rp);color:#fff;padding:32px 24px;flex-shrink:0}
.tc .sb .nm{font-family:var(--fs);font-size:28px;font-weight:700;line-height:1.2;margin-bottom:4px;word-break:break-word}
.tc .sb .tt{font-size:14px;opacity:.85;margin-bottom:24px}
.tc .ss{margin-bottom:28px}
.tc .sst{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:1.5px;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.2)}
.tc .si{font-size:13px;margin-bottom:10px;line-height:1.5;opacity:.9}
.tc .si strong{display:block;font-weight:600;opacity:1;margin-bottom:2px}
.tc .sk{display:inline-block;background:rgba(255,255,255,.15);padding:4px 10px;border-radius:4px;font-size:12px;margin:3px}
.tc .mc{flex:1;padding:32px 28px;background:#fff}
.tc .ms{margin-bottom:28px}
.tc .mst{font-family:var(--fs);font-size:18px;font-weight:700;color:var(--rp);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--rp)}
.tc .ei{margin-bottom:20px}
.tc .eh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.tc .et{font-weight:600;font-size:15px}
.tc .ed{font-size:12px;color:var(--rtm);white-space:nowrap}
.tc .ec2{font-size:13px;color:var(--rt2);margin-bottom:6px}
.tc .eds{font-size:13px;line-height:1.7;color:var(--rt2)}.tc .eds ul{padding-left:18px}
.tc .pi{margin-bottom:16px}.tc .pn{font-weight:600;font-size:14px;margin-bottom:4px}
.tc .pd{font-size:13px;line-height:1.6;color:var(--rt2)}
.tc .sm{font-size:14px;line-height:1.8;color:var(--rt2)}

.tm .hd{background:var(--rp);color:#fff;padding:40px 48px;text-align:center}

.tm .hd .tt{font-size:16px;opacity:.9;margin-bottom:20px;font-weight:300}

.tm .hd .ci{display:flex;align-items:center;gap:6px}
.tm .bd{padding:32px 48px}
.tm .sc2{margin-bottom:28px}
.tm .sct{font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--rp);margin-bottom:16px;padding-bottom:8px;border-bottom:2px solid var(--rp)}

.tm .ei{margin-bottom:20px}
.tm .eh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.tm .et{font-weight:600;font-size:15px}.tm .ed{font-size:12px;color:var(--rtm)}

.tm .sg{display:flex;flex-wrap:wrap;gap:8px}

.tm .pi{margin-bottom:16px}.tm .pn{font-weight:600;font-size:14px;margin-bottom:4px}
.tm .pd{font-size:13px;line-height:1.6;color:var(--rt2)}
.tm .sm{font-size:14px;line-height:1.8;color:var(--rt2)}
.tm .lc{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px}
.tm .lc>div{padding:8px 12px;background:var(--rsa);border-radius:6px}

.tr2 .ab{position:absolute;top:0;left:0;width:8mm;height:100%;background:var(--ra)}

.tr2 .ns{flex:1}
.tr2 .nm{font-family:var(--fs);font-size:32px;font-weight:700;color:var(--rp);margin-bottom:4px}
.tr2 .tt{font-size:15px;color:var(--rt2)}
.tr2 .cp2{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.tr2 .cp3{background:var(--rsa);padding:4px 12px;border-radius:16px;font-size:11px;color:var(--rt2)}
.tr2 .mb{padding:0 48px 40px 64px}
.tr2 .rs{margin-bottom:28px}
.tr2 .rst{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--ra);margin-bottom:14px;display:flex;align-items:center;gap:10px}
.tr2 .rst::before{content:'';width:24px;height:3px;background:var(--ra);border-radius:2px}
.tr2 .ei{margin-bottom:18px;padding-left:16px;border-left:2px solid var(--rb)}
.tr2 .eh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
.tr2 .et{font-weight:600;font-size:15px}
.tr2 .ed{font-size:12px;color:var(--rtm);background:var(--rsa);padding:2px 10px;border-radius:12px}
.tr2 .ec2{font-size:13px;color:var(--rt2);margin-bottom:6px}
.tr2 .eds{font-size:13px;line-height:1.7;color:var(--rt2)}.tr2 .eds ul{padding-left:18px}
.tr2 .sr{display:flex;flex-wrap:wrap;gap:10px}
.tr2 .si2{display:flex;align-items:center;gap:8px;background:var(--rsa);padding:8px 14px;border-radius:8px}
.tr2 .sn{font-size:13px;font-weight:500}
.tr2 .sb2{width:60px;height:4px;background:var(--rb);border-radius:2px;overflow:hidden}
.tr2 .sbf{height:100%;background:var(--ra);border-radius:2px}
.tr2 .pi{margin-bottom:14px}.tr2 .pn{font-weight:600;font-size:14px;margin-bottom:3px}

.tr2 .sm{font-size:14px;line-height:1.8;color:var(--rt2)}
@media (max-width:1200px){.ep{width:360px;min-width:360px}}
@media (max-width:900px){.app{flex-direction:column}.ep{width:100%;height:50vh;min-width:auto;border-right:none;border-bottom:1px solid var(--cbd)}.pp{height:50vh}}
@media print{
  @page{size:A4;margin:0}
  /* === 关键：强制保留所有颜色和背景（浏览器默认会省墨去掉背景） === */
  *,*::before,*::after{
    -webkit-print-color-adjust:exact !important;
    print-color-adjust:exact !important;
    color-adjust:exact !important;
  }
  body *{visibility:hidden}
  .pa,.pa>div{visibility:visible!important}
  .pa{position:static!important;overflow:visible!important;padding:0!important;height:auto!important;display:block!important}
  .pa>div{transform:none!important;transform-origin:top left!important}
  .a4,.a4 *{visibility:visible}
  .a4{position:absolute;left:0;top:0;width:210mm;min-height:297mm;box-shadow:none;margin:0;transform:none!important;background:#fff}
  .pt,.ep,.toast-c,.lo{display:none!important}
}
</style>

// 派生计算年龄（基于 birth，1994-05 格式），不修改 JSON 结构
const calcAge=birth=>{
  if(!birth)return null;
  const m=String(birth).match(/^(\d{4})(?:-(\d{1,2}))?/);
  if(!m)return null;
  const y=parseInt(m[1],10);
  if(isNaN(y))return null;
  const mo=m[2]?parseInt(m[2],10):1;
  const today=new Date();
  let age=today.getFullYear()-y;
  if(today.getMonth()+1<mo||(today.getMonth()+1===mo&&today.getDate()<1))age--;
  return age>=0&&age<150?age:null;
};

// 头像裁剪器（一寸证件照 5:7 比例）
function AvatarCropper({src,onConfirm,onCancel}){
  const[zoom,setZoom]=useState(1);
  const[posX,setPosX]=useState(50);
  const[posY,setPosY]=useState(50);
  const[imgDims,setImgDims]=useState({w:0,h:0});

  useEffect(()=>{
    const img=new Image();
    img.onload=()=>{
      setImgDims({w:img.naturalWidth,h:img.naturalHeight});
      // 默认缩放：让图片短边刚好填满 320×448 框（cover 模式）
      const boxRatio=320/448;
      const imgRatio=img.naturalWidth/img.naturalHeight;
      if(imgRatio>boxRatio){
        setZoom(448/img.naturalHeight);
      }else{
        setZoom(320/img.naturalWidth);
      }
      setPosX(50);setPosY(50);
    };
    img.src=src;
  },[src]);

  const confirm=()=>{
    const img=new Image();
    img.onload=()=>{
      const canvas=document.createElement('canvas');
      canvas.width=320;canvas.height=448;
      const ctx=canvas.getContext('2d');
      // 320×448 框内图片的实际渲染尺寸
      const renderW=img.naturalWidth*zoom;
      const renderH=img.naturalHeight*zoom;
      // 根据 posX/posY (0-100) 计算偏移
      let offsetX,offsetY;
      if(renderW>320){
        offsetX=(posX/100-1)*(renderW-320);
      }else{
        offsetX=(posX/100)*(320-renderW);
      }
      if(renderH>448){
        offsetY=(posY/100-1)*(renderH-448);
      }else{
        offsetY=(posY/100)*(448-renderH);
      }
      // 框内可见区域在图片坐标系中的源区域
      const sx=-offsetX/zoom;
      const sy=-offsetY/zoom;
      const sw=320/zoom;
      const sh=448/zoom;
      ctx.drawImage(img,sx,sy,sw,sh,0,0,320,448);
      onConfirm(canvas.toDataURL('image/jpeg',0.9));
    };
    img.src=src;
  };

  const previewStyle={
    width:160,height:224,
    backgroundImage:`url(${src})`,
    backgroundSize:`${zoom*100}%`,
    backgroundPosition:`${posX}% ${posY}%`,
    backgroundRepeat:'no-repeat',
    backgroundColor:'#f0f0f0',
    borderRadius:4
  };

  return<div className="lo" style={{zIndex:400}}>
    <div style={{background:'#fff',borderRadius:12,padding:24,display:'flex',gap:24,alignItems:'flex-start',maxWidth:'90vw',boxShadow:'0 20px 60px rgba(0,0,0,.3)'}}>
      <div>
        <h3 style={{marginBottom:12,color:'var(--ct)',fontSize:16}}>裁剪头像（一寸证件照 5:7）</h3>
        <div style={previewStyle}/>
        <div style={{fontSize:11,color:'var(--ctm)',marginTop:6,textAlign:'center'}}>{imgDims.w}×{imgDims.h}px</div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:12,minWidth:220,paddingTop:36}}>
        <div>
          <div style={{fontSize:12,color:'var(--ct2)',marginBottom:4,display:'flex',justifyContent:'space-between'}}><span>缩放</span><span>{Math.round(zoom*100)}%</span></div>
          <input type="range" min="0.3" max="3" step="0.02" value={zoom} onChange={e=>setZoom(parseFloat(e.target.value))} style={{width:'100%'}}/>
        </div>
        <div>
          <div style={{fontSize:12,color:'var(--ct2)',marginBottom:4,display:'flex',justifyContent:'space-between'}}><span>左右位置</span><span>{posX}</span></div>
          <input type="range" min="0" max="100" value={posX} onChange={e=>setPosX(parseInt(e.target.value))} style={{width:'100%'}}/>
        </div>
        <div>
          <div style={{fontSize:12,color:'var(--ct2)',marginBottom:4,display:'flex',justifyContent:'space-between'}}><span>上下位置</span><span>{posY}</span></div>
          <input type="range" min="0" max="100" value={posY} onChange={e=>setPosY(parseInt(e.target.value))} style={{width:'100%'}}/>
        </div>
        <div style={{display:'flex',gap:8,marginTop:8}}>
          <button type="button" className="btn bp" onClick={confirm} style={{flex:1}}><Ic.Ch/> 确认</button>
          <button type="button" className="btn bs" onClick={onCancel} style={{flex:1}}>取消</button>
        </div>
        <div style={{fontSize:11,color:'var(--ctm)',lineHeight:1.5,borderTop:'1px solid var(--cbd)',paddingTop:8}}>提示：标准一寸证件照为 2.5×3.5cm（5:7），输出分辨率 200×280px（足够印刷）。</div>
      </div>
    </div>
  </div>
}

      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:32}}>
        <div>
          {v.education!==false&&ed.length>0&&<div className="rs"><div className="rst">教育背景</div>{ed.map(e=><div key={e.id} className="ei" style={{borderLeft:'none',paddingLeft:0,marginBottom:12}}><div className="et">{e.school}</div><div className="ec2">{e.degree} · {e.field}</div><div className="ed" style={{background:'none',padding:0,marginTop:4}}>{e.startDate} - {e.endDate}</div></div>)}</div>}
          {v.studentLeadership!==false&&sl.length>0&&<div className="rs"><div className="rst">学生干部经历</div>{sl.map(s=><div key={s.id} className="pi"><div className="pn">{s.position}</div><div className="pd" style={{marginBottom:2}}>{s.org} · {s.startDate} - {s.endDate}</div><div className="pd">{desc(s.description)}</div></div>)}</div>}
          {v.trainings!==false&&tr.length>0&&<div className="rs"><div className="rst">培训经历</div>{tr.map(t2=><div key={t2.id} className="pi"><div className="pn">{t2.name}</div><div className="pd" style={{marginBottom:2}}>{t2.org} · {t2.startDate} - {t2.endDate}</div></div>)}</div>}
        </div>
        <div>
          {v.skills!==false&&sk.length>0&&<div className="rs"><div className="rst">专业技能</div><div className="sr">{sk.map(s=><div key={s.id} className="si2"><span className="sn">{s.name}</span><div className="sb2"><div className="sbf" style={{width:s.level+'%'}}></div></div></div>)}</div></div>}
          {v.languages!==false&&lg.length>0&&<div className="rs"><div className="rst">语言能力</div>{lg.map(l=><div key={l.id} style={{marginBottom:8,fontSize:13}}><strong>{l.name}</strong> · {l.level}{l.score?` (${l.score})`:''}</div>)}</div>}
          {v.certificates!==false&&ce.length>0&&<div className="rs"><div className="rst">获得证书</div>{ce.map(c=><div key={c.id} style={{marginBottom:8,fontSize:13}}><strong>{c.name}</strong><br/><span style={{color:'var(--rtm)'}}>{c.date}{c.desc?` · ${c.desc}`:''}</span></div>)}</div>}
        </div>
      </div>
    </div>
  </div>
}

// Main App
function App(){
  const[data,setData]=useState(load);
  const[template,setTemplate]=useState(()=>localStorage.getItem('proresume_tpl')||'classic');
  const[theme,setTheme]=useState(()=>localStorage.getItem('proresume_thm')||'c');
  const[tab,setTab]=useState('personal');
  const[zoom,setZoom]=useState(()=>parseFloat(localStorage.getItem('proresume_zm'))||0.75);
  const[exp,setExp]=useState(false);
  const ref=useRef();
  const{show}=useT();

  useEffect(()=>save(data),[data]);
  useEffect(()=>localStorage.setItem('proresume_tpl',template),[template]);
  useEffect(()=>localStorage.setItem('proresume_thm',theme),[theme]);
  useEffect(()=>localStorage.setItem('proresume_zm',zoom),[zoom]);
  useEffect(()=>document.body.setAttribute('data-t',theme),[theme]);

  const up=k=>v=>setData(p=>({...p,[k]:v}));
  const counts={
    advantages:data.advantages?1:0,jobStatus:data.jobStatus?1:0,intention:(data.intention.position||data.intention.salary)?1:0,
    experience:data.experience.length,education:data.education.length,projects:data.projects.length,
    trainings:data.trainings.length,languages:data.languages.length,skills:data.skills.length,
    certificates:data.certificates.length,studentLeadership:data.studentLeadership.length
  };

  const exportPDF=async()=>{
    if(!ref.current)return;
    setExp(true);
    try{
      const wrapperEl=ref.current;
      const el=wrapperEl.querySelector('.a4');
      if(!el){show('预览区域未找到','error');return}

      // === 关键：临时按100%布局导出，避免缩放导致格式错乱 ===
      const origWrapperTransform=wrapperEl.style.transform;
      const origWrapperTransformOrigin=wrapperEl.style.transformOrigin;
      const origA4Transform=el.style.transform;
      wrapperEl.style.transform='scale(1)';
      wrapperEl.style.transformOrigin='top center';
      el.style.transform='none';
      el.style.width='var(--a4w)';
      el.style.minHeight='var(--a4h)';
      await new Promise(r=>setTimeout(r,350));

      // === 关键：html2canvas 渲染（适中的scale即可，1.5倍足够清晰） ===
      const canvas=await html2canvas(el,{
        scale:1.5,            // 1.5倍比2倍节省约44%像素，体积更小，清晰度仍足够
        useCORS:true,
        allowTaint:true,
        backgroundColor:'#fff', // 白色背景，JPEG友好
        logging:false,
        scrollX:0,
        scrollY:-window.scrollY,
        windowWidth:el.scrollWidth,
        windowHeight:el.scrollHeight
      });

      // 恢复原始缩放
      wrapperEl.style.transform=origWrapperTransform;
      wrapperEl.style.transformOrigin=origWrapperTransformOrigin;
      el.style.transform=origA4Transform;

      // === 关键：切割canvas + JPEG格式，大幅降低PDF体积 ===
      // 图片型 PDF 文字无法复制（天然特性）
      const{jsPDF}=window.jspdf;
      const pdf=new jsPDF('p','mm','a4');
      const pdfW=210,pdfH=297; // A4 尺寸（mm）
      const imgW=pdfW;
      const imgH=(canvas.height*imgW)/canvas.width;
      const pageHInPx=(canvas.width*pdfH)/imgW;
      const totalPages=Math.ceil(canvas.height/pageHInPx);
      const imgFormat='JPEG';   // JPEG 比 PNG 体积小 60-80%
      const imgQuality=0.88;    // 质量与体积的甜点（0.85-0.92 最佳）

      if(totalPages<=1){
        const imgData=canvas.toDataURL('image/jpeg',imgQuality);
        pdf.addImage(imgData,imgFormat,0,0,imgW,imgH);
      }else{
        // 多页：按页切割canvas，每页都是完整的横向切片
        for(let i=0;i<totalPages;i++){
          const sliceH=Math.min(pageHInPx,canvas.height-i*pageHInPx);
          const pageCanvas=document.createElement('canvas');
          pageCanvas.width=canvas.width;
          pageCanvas.height=sliceH;
          const ctx=pageCanvas.getContext('2d');
          ctx.fillStyle='#ffffff';
          ctx.fillRect(0,0,pageCanvas.width,pageCanvas.height);
          ctx.drawImage(
            canvas,
            0,i*pageHInPx,canvas.width,sliceH, // 源区域
            0,0,canvas.width,sliceH            // 目标区域
          );
          const pageImg=pageCanvas.toDataURL('image/jpeg',imgQuality);
          const pageImgH=(sliceH*imgW)/canvas.width;
          if(i>0)pdf.addPage();
          pdf.addImage(pageImg,imgFormat,0,0,imgW,pageImgH);
        }
      }

      pdf.save(`${data.personal.name||'resume'}_${new Date().toISOString().slice(0,10)}.pdf`);
      show('PDF 导出成功！','success');
    }catch(e){console.error(e);show('导出失败：'+e.message,'error')}
    finally{setExp(false)}
  };

  const exportJSON=()=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download=`resume_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();
    URL.revokeObjectURL(url);show('JSON 备份已下载','success');
  };

  const importJSON=e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{
      try{
        const d=JSON.parse(ev.target.result);
        if(d.personal&&d.experience&&d.education){setData(d);show('数据导入成功！','success')}
        else show('文件格式不正确','error');
      }catch(err){show('解析失败：'+err.message,'error')}
    };
    r.readAsText(f);e.target.value='';
  };

  const reset=()=>{if(confirm('确定要重置为默认数据吗？当前数据将丢失。')){setData(defaultData);show('已重置为默认数据','info')}};

  const tabs=[
    {id:'personal',l:'基本信息',i:<Ic.U/>},
    {id:'job',l:'求职',i:<Ic.B/>},
    {id:'experience',l:'工作/实习',i:<Ic.B/>},
    {id:'education',l:'教育',i:<Ic.G/>},
    {id:'projects',l:'项目',i:<Ic.F/>},
    {id:'trainings',l:'培训',i:<Ic.G/>},
    {id:'leadership',l:'学生干部',i:<Ic.St/>},
    {id:'skills',l:'技能',i:<Ic.Cd/>}
  ];

  const tpls=[{id:'classic',l:'经典分栏'},{id:'modern',l:'现代上下'},{id:'creative',l:'创意布局'}];
  const ths=[{id:'c',l:'经典蓝',c:'#1e3a5f'},{id:'w',l:'暖棕',c:'#744210'},{id:'s',l:'现代灰',c:'#0f172a'}];

  return<div className="app">
    <div className="ep">
      <div className="ehd"><h1>ProResume</h1><p>专业简历生成器 · 所见即所得</p></div>
      <div className="ec">
        <div className="tabs">{tabs.map(t=><button key={t.id} className={`tab ${tab===t.id?'on':''}`} onClick={()=>setTab(t.id)}>{t.i}{t.l}</button>)}</div>
        {tab==='personal'&&<><PersonalForm data={data.personal} onChange={up('personal')}/><VP visibility={data.visibility} counts={counts} onChange={up('visibility')}/></>}
        {tab==='job'&&<JobForm jobStatus={data.jobStatus} intention={data.intention} advantages={data.advantages} onJobStatusChange={v=>setData(p=>({...p,jobStatus:v}))} onIntentionChange={v=>setData(p=>({...p,intention:v}))} onAdvChange={up('advantages')}/>}
        {tab==='experience'&&<ListForm title="工作/实习经历" icon={<Ic.B/>} items={data.experience} onChange={up('experience')} defaults={{type:'工作'}} addMsg="已添加经历" addText="添加工作/实习经历" fields={[
          {key:'type',label:'类型',type:'select',options:['工作','实习']},
          {row:[{key:'company',label:'公司',ph:'公司名称'},{key:'title',label:'职位',ph:'职位名称'}]},
          {key:'location',label:'工作地点',ph:'工作城市'},
          {key:'dateRange',label:'起止时间',months:[{key:'startDate'},{key:'endDate',ph:'至今'}]},
          {key:'description',label:'工作描述',type:'textarea',rows:5,ph:'每行描述用回车分隔'}
        ]}/>}
        {tab==='education'&&<ListForm title="教育经历" icon={<Ic.G/>} items={data.education} onChange={up('education')} addMsg="已添加教育" addText="添加教育经历" fields={[
          {row:[{key:'school',label:'学校',ph:'学校名称'},{key:'degree',label:'学历',type:'select',options:['本科','硕士','博士','大专','高中','中专']}]},
          {key:'field',label:'专业',ph:'所学专业'},
          {key:'dateRange',label:'起止时间',months:[{key:'startDate'},{key:'endDate'}]},
          {key:'description',label:'描述',type:'textarea',rows:2,ph:'主修课程、荣誉、GPA等'}
        ]}/>}
        {tab==='projects'&&<ListForm title="项目经历" icon={<Ic.F/>} items={data.projects} onChange={up('projects')} addMsg="已添加项目" addText="添加项目经历" fields={[
          {row:[{key:'name',label:'项目名称',ph:'项目名'},{key:'link',label:'项目链接',ph:'https://...'}]},
          {key:'dateRange',label:'起止时间',months:[{key:'startDate',label:'起始'},{key:'endDate',ph:'至今'}]},
          {key:'tech',label:'技术栈',ph:'React, Node.js, ...'},
          {key:'description',label:'项目描述',type:'textarea',rows:3,ph:'项目背景、您的角色和成果'}
        ]}/>}
        {tab==='trainings'&&<ListForm title="培训经历" icon={<Ic.G/>} items={data.trainings} onChange={up('trainings')} addMsg="已添加培训" addText="添加培训经历" addOnEmpty="暂无培训经历，可点击下方按钮添加" fields={[
          {key:'name',label:'培训名称',ph:'培训课程/项目名称'},
          {key:'org',label:'培训机构',ph:'培训机构名称'},
          {key:'dateRange',label:'起止时间',months:[{key:'startDate'},{key:'endDate'}]},
          {key:'description',label:'培训内容',type:'textarea',rows:3,ph:'培训内容、所获证书等'}
        ]}/>}
        {tab==='leadership'&&<ListForm title="学生干部经历" icon={<Ic.St/>} items={data.studentLeadership} onChange={up('studentLeadership')} addMsg="已添加干部经历" addText="添加学生干部经历" fields={[
          {row:[{key:'position',label:'担任职务',ph:'如：学生会主席'},{key:'org',label:'组织名称',ph:'如：校学生会'}]},
          {key:'dateRange',label:'起止时间',months:[{key:'startDate'},{key:'endDate'}]},
          {key:'description',label:'工作描述',type:'textarea',rows:4,ph:'主要工作内容和成果'}
        ]}/>}
        {tab==='skills'&&<>
          <ListForm title="专业技能" icon={<Ic.Cd/>} items={data.skills} onChange={up('skills')} addMsg="已添加技能" addText="添加技能" fields={[
            {row:[{key:'name',label:'技能名称',ph:'如：React'},{key:'level',label:'熟练度',type:'range'}]}
          ]}/>
          <ListForm title="语言能力" icon={<Ic.Gl/>} items={data.languages} onChange={up('languages')} addMsg="已添加语言" addText="添加语言" fields={[
            {row:[{key:'name',label:'语言',ph:'如：英语'},{key:'level',label:'等级',type:'select',options:['CET-4','CET-6','专业四级','专业八级','雅思','托福','PETS-3','PETS-5','入门','基础','熟练','精通','母语']}]},
            {key:'score',label:'分数/备注',ph:'如：528 分（可选）'}
          ]}/>
          <ListForm title="获得证书" icon={<Ic.Aw/>} items={data.certificates} onChange={up('certificates')} addMsg="已添加证书" addText="添加证书" fields={[
            {key:'name',label:'证书名称',ph:'如：软件设计师'},
            {key:'date',label:'获得时间',type:'month'},
            {key:'desc',label:'描述',ph:'发证机构、证书编号等（可选）'}
          ]}/>
        </>}
        <div className="sc"><div className="st"><Ic.Sv/>数据管理</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            <button className="btn bs" onClick={exportJSON}><Ic.Dl/>导出 JSON</button>
            <label className="btn bs" style={{cursor:'pointer'}}><Ic.Ul/>导入 JSON<input type="file" accept=".json" onChange={importJSON} style={{display:'none'}}/></label>
            <button className="btn bg" onClick={reset}><Ic.Rc/>重置数据</button>
          </div>
        </div>
      </div>
    </div>
    <div className="pp">
      <div className="pt">
        <div className="tg"><span className="tl"><Ic.La/>模板</span><select className="sel" value={template} onChange={e=>setTemplate(e.target.value)}>{tpls.map(t=><option key={t.id} value={t.id}>{t.l}</option>)}</select></div>
        <div className="tg"><span className="tl"><Ic.Pa/>配色</span>{ths.map(t=><div key={t.id} className={`cs ${theme===t.id?'on':''}`} style={{background:t.c}} title={t.l} onClick={()=>setTheme(t.id)}/>)}</div>
        <div className="tg"><span className="tl">缩放</span><div className="zc"><button className="btn bg bi" onClick={()=>setZoom(z=>Math.max(.3,z-.1))}><Ic.Zo/></button><span className="zv">{Math.round(zoom*100)}%</span><button className="btn bg bi" onClick={()=>setZoom(z=>Math.min(1.5,z+.1))}><Ic.Zi/></button></div></div>
        <div className="tg" style={{gap:8}}>
          <button className="btn bp" onClick={exportPDF} disabled={exp} title="导出图片型PDF，体积小，文字不可复制"><Ic.Ft/>{exp?'导出中...':'导出 PDF'}</button>
          <button className="btn bs" onClick={()=>window.print()} title="调用浏览器打印，文字可复制+可搜索，矢量"><Ic.Pr/>打印</button>
        </div>
      </div>
      <div className="pa"><div ref={ref} style={{transform:`scale(${zoom})`,transformOrigin:'top center'}}><Preview data={data} template={template} theme={theme}/></div></div>
    </div>
    {exp&&<div className="lo"><div className="ls"></div></div>}
  </div>
}

ReactDOM.createRoot(document.getElementById('root')).render(<TP><App/></TP>);
</script>
</body>
</html>
